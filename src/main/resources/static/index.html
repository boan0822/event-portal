<!DOCTYPE html>
<html lang="zh-TW">
    <header>
        <div class="header-content">
            <div>
                <h1>校園活動管理平台</h1>
                <p>Campus Event Portal</p>
                <link rel="stylesheet" href="style.css">
            </div>
            <!-- 右上角顯示登入者資訊和登出按鈕 -->
            <div class="header-user">
                <span id="header-username"></span>
                <span id="header-role" class="role-badge"></span>
                <button onclick="logout()">登出</button>
            </div>
        </div>
    </header>
    <body>

   

    <main>

        <!-- 左欄：新增活動 + AI 功能 -->
        <section class="panel" id="create-panel">
            <h2>新增活動</h2>

            <!-- AI 產生描述區塊 -->
            <div class="ai-box">
                <label>AI 產生活動描述</label>
                <input 
                    type="text" 
                    id="ai-keywords" 
                    placeholder="輸入關鍵字，例如：程式設計、競賽、大學生"
                >
                <button id="ai-btn" onclick="generateDescription()">AI 產生描述</button>
                <span id="ai-status"></span>
            </div>

            <!-- 活動表單 -->
            <form id="event-form">
                <div class="form-group">
                    <label>活動標題 *</label>
                    <input type="text" id="title" required placeholder="例如：2025 程式設計黑客松">
                </div>

                <div class="form-group">
                    <label>活動描述</label>
                    <!-- AI 產生的文字會自動填入這裡 -->
                    <textarea id="description" rows="4" placeholder="活動描述（可使用 AI 產生）"></textarea>
                </div>

                <div class="form-group">
                    <label>地點</label>
                    <input type="text" id="location" placeholder="例如：台科大國際大樓">
                </div>

                <div class="form-group">
                    <label>開始時間</label>
                    <input type="datetime-local" id="startTime">
                </div>

                <div class="form-group">
                    <label>結束時間</label>
                    <input type="datetime-local" id="endTime">
                </div>

                <div class="form-group">
                    <label>名額上限 *</label>
                    <input type="number" id="capacity" required min="1" placeholder="例如：100">
                </div>

                <button type="button" onclick="submitCreateEvent()">新增活動</button>
            </form>
        </section>

        <!-- 右欄：活動列表 -->
        <section class="panel" id="list-panel">
            <h2>活動列表</h2>
            <button onclick="loadEvents()">重新整理</button>

            <!-- 活動卡片會動態插入這裡 -->
            <div id="events-container">
                <p class="hint">點擊重新整理載入活動</p>
            </div>
        </section>

    </main>

    <!-- 報名 Modal（彈出視窗） -->
    <div id="register-modal" class="modal hidden">
        <div class="modal-content">
            <h3>報名活動</h3>
            <p id="modal-event-title"></p>

            <div class="form-group">
                <label>姓名 *</label>
                <input type="text" id="reg-name" placeholder="你的姓名">
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="reg-email" placeholder="你的 Email">
            </div>

            <div class="modal-buttons">
                <button onclick="submitRegistration()">確認報名</button>
                <button class="cancel" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
